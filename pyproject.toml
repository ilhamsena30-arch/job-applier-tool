[project]
name = "job-applier-tool"
version = "0.1.0"
description = "Autonomous job application agent (search -> match -> apply -> track -> email)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
