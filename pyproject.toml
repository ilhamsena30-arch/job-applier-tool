[project]
name = "job-applier-tool"
version = "0.1.0"
description = "Autonomous job application agent (search -> match -> apply -> track -> email)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Deliberate exceptions for a browser-automation agent:
#  - broad `except Exception` is required around page interactions (elements
#    disappear, navigations race, network is flaky) and is logged by callers.
#  - datetime.now() without tz is used only for local date math.
ignore = [
    "BLE001",
    "S110",
    "S112",
    "DTZ005",
    "DTZ007",
    "RUF001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
